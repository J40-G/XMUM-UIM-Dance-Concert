<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>United in Motion | XMUM Dance Concert 2026</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase Compat Libraries for Real-Time Sync -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- HTML5 QR Code Scanner for Door Crew -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0d0d; color: #ffffff; text-align: center; min-height: 100vh; }

    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: rgba(0, 0, 0, 0.9); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #1f1f1f; }
    .nav-brand { font-weight: bold; letter-spacing: 1px; color: #ffb6c1; font-size: 0.95rem; }
    .nav-links a { color: #cccccc; text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
    .nav-links a:hover { color: #ffb6c1; }

    /* Hero Section */
    .hero { padding: 20px; max-width: 900px; margin: 0 auto; }
    .hero-image-overlay { position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); }
    .hero-banner-img { width: 100%; max-height: 520px; object-fit: cover; filter: brightness(0.35); }
    .hero-text-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; }
    .subtitle { font-size: 0.85rem; letter-spacing: 3px; color: #ffb6c1; }
    .main-title { font-size: 2.6rem; letter-spacing: 2px; margin: 10px 0; font-weight: 800; }
    
    .event-meta-pills { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; font-size: 0.85rem; color: #cccccc; flex-wrap: wrap; }
    .event-meta-pills span { background: rgba(255, 255, 255, 0.1); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); }

    /* Dual Logos Above Buy Button */
    .hero-dual-logos { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; }
    .hero-logo-circle { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #ffb6c1; overflow: hidden; background: #1a1a1a; }
    .hero-logo-circle img { width: 100%; height: 100%; object-fit: cover; }
    .logo-cross { color: #ffb6c1; font-weight: bold; font-size: 1.2rem; }

    .btn-pink { background-color: #f3b0c3; color: #000000; padding: 14px 40px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 1rem; border: none; cursor: pointer; transition: transform 0.2s; }
    .btn-pink:hover { background-color: #f7c5d3; transform: scale(1.03); }
    .btn-pink:disabled { background-color: #555; color: #888; cursor: not-allowed; transform: none; }

    /* Pricing Section & Countdown */
    .section { padding: 50px 20px; border-top: 1px solid #1a1a1a; max-width: 900px; margin: 0 auto; }
    .section h2 { font-size: 1.4rem; letter-spacing: 2px; color: #ffb6c1; margin-bottom: 15px; }
    .pricing-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
    .pricing-card-wrapper { position: relative; display: inline-block; }
    .pricing-card-img { width: 380px; max-width: 100%; border-radius: 12px; border: 1px solid #333; }
    .sold-out-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); color: #ff4d4d; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; letter-spacing: 2px; }

    /* Page Container */
    .page-container { padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
    .page-header { margin-bottom: 20px; position: relative; }
    .btn-back { position: absolute; left: 0; top: 0; background: transparent; border: 1px solid #444; color: #ccc; padding: 8px 16px; border-radius: 20px; cursor: pointer; }

    /* Stage Banner */
    .stage-banner { background-color: #87CEEB; color: #000000; padding: 10px; margin: 20px auto 30px auto; max-width: 800px; letter-spacing: 4px; font-weight: bold; font-size: 1rem; border-radius: 6px; text-transform: uppercase; }

    /* Seat Grid */
    .seat-map-wrapper { overflow-x: auto; padding-bottom: 20px; }
    .seat-map { display: inline-block; min-width: 850px; }
    .seat-row { display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
    .row-label { width: 85px; text-align: right; padding-right: 15px; font-size: 0.75rem; color: #888; }
    .row-seats { display: flex; gap: 4px; }
    .seat { width: 20px; height: 22px; border-radius: 4px; border: none; font-size: 0.65rem; font-weight: bold; color: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .seat.blank { background-color: #4a4a4a; color: transparent; cursor: default; }
    
    /* Zone Colors */
    .seat.zone-a { background-color: #d90429; color: #fff; } /* Red */
    .seat.zone-b { background-color: #b8e2f4; color: #000; } /* Soft Blue */
    .seat.zone-c { background-color: #abf7b1; color: #000; } /* Light Green */
    .seat.selected { background-color: #ffea00 !important; color: #000 !important; }
    .seat.holding { background-color: #ff9f1c !important; color: #000 !important; cursor: not-allowed; }
    .seat.occupied { background-color: #4a4a4a !important; color: transparent !important; cursor: not-allowed; }

    .legend { display: flex; justify-content: center; gap: 20px; margin: 30px 0; font-size: 0.85rem; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .color-box { width: 16px; height: 16px; border-radius: 3px; }
    .color-box.zone-a { background-color: #d90429; }
    .color-box.zone-b { background-color: #b8e2f4; }
    .color-box.zone-c { background-color: #abf7b1; }
    .color-box.selected { background-color: #ffea00; }
    .color-box.holding { background-color: #ff9f1c; }
    .color-box.occupied { background-color: #4a4a4a; }

    .checkout-bar { margin-top: 30px; background: #141414; padding: 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto; border: 1px solid #222; }
    .selection-summary { text-align: left; font-size: 0.9rem; line-height: 1.6; }
