<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQxDYrkKlnOsNwVSTiNfxplJ-TszuZHeG_hxYUa2a6u-mbv1votVSDWfkxyndPPgQ/exec";

    const firebaseConfig = {
      apiKey: "AIzaSyCq-idSaUh0RNSTYGPcfj6Qf5hpro53AZc",
      authDomain: "xmum-uim-dance-concert.firebaseapp.com",
      projectId: "xmum-uim-dance-concert",
      storageBucket: "xmum-uim-dance-concert.firebasestorage.app",
      messagingSenderId: "5997955641",
      appId: "1:5997955641:web:b679c10a104f7978741be8",
      measurementId: "G-297BT3NRB1"
    };

    let db = null;
    try {
      if (typeof firebase !== "undefined" && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      }
    } catch (err) {}

    setTimeout(() => {
      const modal = document.getElementById('welcome-modal');
      if (modal) {
        modal.style.opacity = '0';
        setTimeout(() => modal.style.display = 'none', 800);
      }
    }, 3000);

    const EB_DEADLINE = new Date("2026-11-20T23:59:59+08:00");
    let isEarlyBird = new Date() < EB_DEADLINE;

    const standardPrices = isEarlyBird ? { 'zone-a': 40, 'zone-b': 30, 'zone-c': 20 } : { 'zone-a': 45, 'zone-b': 35, 'zone-c': 25 };
    const bundlePrices = isEarlyBird ? { 'zone-a': 70, 'zone-b': 60, 'zone-c': 50 } : { 'zone-a': 80, 'zone-b': 70, 'zone-c': 60 };

    let selectedTier = "standard";
    let appliedReferralCode = "";
    let holdTimerInterval = null;

    const VALID_COMMITTEE_CODES = [
      "ADVISOR", "OC", "VOC1", "VOC2", "SEC1", "SEC2", "TRE1", "TRE2",
      "EP1", "EP2", "EP3", "EP4", "EP5",
      "GA1", "GA2", "GA3", "GA4", "GA5", "GA6",
      "PR1", "PR2", "PR3", "PR4", "PR5", "PR6", "PR7", "PR8", "PR9", "PR10",
      "DG1", "DG2", "DG3", "DG4", "DG5",
      "PGVG1", "PGVG2", "PGVG3", "PGVG4", "PGVG5", "PGVG6", "PGVG7",
      "PT1", "PT2", "PT3", "PT4", "PT5"
    ];

    function setTicketTier(tier) {
      selectedTier = tier;
      document.getElementById("tier-std").className = `tier-btn ${tier === 'standard' ? 'active' : ''}`;
      document.getElementById("tier-bundle").className = `tier-btn ${tier === 'bundle' ? 'active' : ''}`;
      
      const tierName = tier === 'bundle' ? '⭐ T-Shirt Bundle (+T-shirt)' : 'Standard Ticket';
      document.getElementById("selected-tier-text").innerText = tierName;

      const currentActivePrices = tier === 'bundle' ? bundlePrices : standardPrices;
      document.getElementById("price-tag-a").innerText = `RM${currentActivePrices['zone-a']}`;
      document.getElementById("price-tag-b").innerText = `RM${currentActivePrices['zone-b']}`;
      document.getElementById("price-tag-c").innerText = `RM${currentActivePrices['zone-c']}`;

      recalculateSeatPrices();
    }

    function applyCommitteeCode() {
      const codeInput = document.getElementById("promo-code-input").value.trim().toUpperCase();
      const messageElem = document.getElementById("promo-message");
      messageElem.style.display = "block";

      if (codeInput === "") {
        appliedReferralCode = "";
        messageElem.style.color = "#aaa";
        messageElem.innerText = "No code applied (Standard Pricing).";
        recalculateSeatPrices();
        return;
      }

      // STRICT CHECK: Maximum 2 seats allowed for committee discount
      if (selectedSeats.length > 2) {
        messageElem.style.color = "#ff8585";
        messageElem.innerText = "❌ Committee code is valid for a maximum of 2 seats only. Discount denied.";
        appliedReferralCode = "";
        document.getElementById("promo-code-input").value = "";
        recalculateSeatPrices();
        return;
      }

      if (!VALID_COMMITTEE_CODES.includes(codeInput)) {
        messageElem.style.color = "#ff8585";
        messageElem.innerText = "❌ Invalid committee referral code.";
        appliedReferralCode = "";
        recalculateSeatPrices();
        return;
      }

      appliedReferralCode = codeInput;
      recalculateSeatPrices();

      messageElem.style.color = "#95d5b2";
      messageElem.innerText = `✅ Committee Code '${codeInput}' applied successfully! Special pricing activated for ${selectedSeats.length} seat(s).`;
    }

    function recalculateSeatPrices() {
      const messageElem = document.getElementById("promo-message");

      // STRICT ENFORCEMENT: If selected seats exceed 2, force-clear referral code immediately
      if (selectedSeats.length > 2 && appliedReferralCode !== "") {
        appliedReferralCode = "";
        document.getElementById("promo-code-input").value = "";
        if (messageElem) {
          messageElem.style.display = "block";
          messageElem.style.color = "#ff8585";
          messageElem.innerText = "❌ Referral code removed because more than 2 seats were selected (max 2 seats allowed).";
        }
      }

      let total = 0;
      selectedSeats.forEach(s => {
        let baseTable = selectedTier === 'bundle' ? bundlePrices : standardPrices;
        let seatPrice = baseTable[s.zoneKey];

        // Apply discount ONLY if a valid code is active AND selected seats are 2 or fewer
        if (appliedReferralCode !== "" && selectedSeats.length <= 2) {
          if (s.zone === "Zone A") seatPrice = selectedTier === 'bundle' ? 55 : 25;
          if (s.zone === "Zone B") seatPrice = selectedTier === 'bundle' ? 45 : 15;
        }
        s.price = seatPrice;
        total += seatPrice;
      });

      if (document.getElementById("payment-amount-summary")) {
        document.getElementById("payment-amount-summary").innerText = total;
      }
      if (document.getElementById("total-price")) {
        document.getElementById("total-price").innerText = total;
      }
    }

    function updatePricingUI() {
      const notice = document.getElementById("pricing-status-notice");
      const ebOverlay = document.getElementById("eb-overlay");
      if (notice) {
        if (isEarlyBird) {
          notice.innerText = "⚡ Early Bird Pricing & Bundles ACTIVE! (Ends 20th Nov 2026, 11:59 PM Malaysia Time)";
          if (ebOverlay) ebOverlay.style.display = "none";
        } else {
          notice.innerText = "🔒 Early Bird Pricing HAS ENDED. Normal Price & Bundles apply.";
          if (ebOverlay) ebOverlay.style.display = "flex";
        }
      }
      setTicketTier('standard');
    }

    function getZoneLabel(zoneType) {
      if (zoneType === 'zone-a') return 'Zone A';
      if (zoneType === 'zone-b') return 'Zone B';
      if (zoneType === 'zone-c') return 'Zone C';
      return '';
    }

    function formatSeatLabel(seat) {
      return `${seat.zone} - ${seat.rowName} - Seat ${seat.num}`;
    }

    const SEATING_CONFIG = [
      { rowName: "Row 1 (VIP)", seats: Array(34).fill(0).map((_, i) => ({ num: `VIP-${i+1}`, type: "occupied" })) },
      { rowName: "Row 2", seats: Array(35).fill(0).map((_, i) => ({ num: `${1 + i}`, type: Number(1+i) === 200 ? "occupied" : "zone-a" })) },
      { rowName: "Row 3", seats: Array(34).fill(0).map((_, i) => ({ num: `${36 + i}`, type: Number(36+i) === 200 ? "occupied" : "zone-a" })) },
      { rowName: "Row 4", seats: Array(35).fill(0).map((_, i) => ({ num: `${70 + i}`, type: Number(70+i) === 200 ? "occupied" : "zone-a" })) },
      { rowName: "Row 5", seats: Array(34).fill(0).map((_, i) => ({ num: `${105 + i}`, type: Number(105+i) === 200 ? "occupied" : "zone-a" })) },
      { rowName: "Row 6", seats: Array(35).fill(0).map((_, i) => ({ num: `${139 + i}`, type: Number(139+i) === 200 ? "occupied" : "zone-a" })) },
      { rowName: "Row 7", seats: Array(34).fill(0).map((_, i) => ({ num: `${174 + i}`, type: Number(174+i) === 200 ? "occupied" : "zone-a" })) },
      { rowName: "Row 8", seats: Array(35).fill(0).map((_, i) => ({ num: `${1 + i}`, type: [166, 167].includes(Number(1+i)) ? "occupied" : "zone-b" })) },
      { rowName: "Row 9", seats: Array(34).fill(0).map((_, i) => ({ num: `${36 + i}`, type: [166, 167].includes(Number(36+i)) ? "occupied" : "zone-b" })) },
      { rowName: "Row 10", seats: Array(35).fill(0).map((_, i) => ({ num: `${70 + i}`, type: [166, 167].includes(Number(70+i)) ? "occupied" : "zone-b" })) },
      { rowName: "Row 11", seats: Array(34).fill(0).map((_, i) => ({ num: `${105 + i}`, type: [166, 167].includes(Number(105+i)) ? "occupied" : "zone-b" })) },
      { rowName: "Row 12", seats: Array(35).fill(0).map((_, i) => ({ num: `${139 + i}`, type: [166, 167].includes(Number(139+i)) ? "occupied" : "zone-b" })) },
      { rowName: "Row 13", seats: Array(34).fill(0).map((_, i) => ({ num: `${1 + i}`, type: [59, 60, 61].includes(Number(1+i)) ? "occupied" : "zone-c" })) },
      { rowName: "Row 14", seats: Array(35).fill(0).map((_, i) => ({ num: `${35 + i}`, type: [59, 60, 61].includes(Number(35+i)) ? "occupied" : "zone-c" })) },
      { rowName: "Row 15", seats: Array(34).fill(0).map((_, i) => ({ num: `${70 + i}`, type: "occupied" })) },
      { rowName: "Row 16", seats: Array(35).fill(0).map((_, i) => ({ num: `${104 + i}`, type: "occupied" })) },
      { rowName: "Row 17", seats: Array(30).fill(0).map((_, i) => ({ num: `${139 + i}`, type: "occupied" })) }
    ];

    let selectedSeats = [];
    let selectedPaymentMethod = "";

    function listenToSeatUpdates() {
      if (!db) return;
      try {
        db.collection("concert_seats").onSnapshot((snapshot) => {
          snapshot.docChanges().forEach((change) => {
            const data = change.doc.data();
            const seatBtn = document.querySelector(`[data-id="${change.doc.id}"]`);
            if (seatBtn) {
              if (seatBtn.classList.contains("occupied") && !seatBtn.dataset.dynamicOccupied) return;

              seatBtn.classList.remove("holding");
              const now = Date.now();
              const isExpired = data.timestamp && (now - data.timestamp.toMillis() > 600000);

              if (data.status === "occupied") {
                seatBtn.classList.add("occupied");
                seatBtn.dataset.dynamicOccupied = "true";
              } else if (data.status === "holding" && !isExpired) {
                if (!selectedSeats.some(s => s.id === change.doc.id)) {
                  seatBtn.classList.add("holding");
                }
              }
            }
          });
        });
      } catch (err) {}
    }

    function renderSeatingGrid() {
      const container = document.getElementById("seat-map");
      if (!container) return;
      container.innerHTML = "";

      SEATING_CONFIG.forEach(row => {
        const rowElem = document.createElement("div");
        rowElem.className = "seat-row";
        const label = document.createElement("span");
        label.className = "row-label";
        label.innerText = row.rowName;
        rowElem.appendChild(label);

        const seatsDiv = document.createElement("div");
        seatsDiv.className = "row-seats";

        row.seats.forEach(seat => {
          const seatBtn = document.createElement("button");
          const seatId = `${row.rowName}-${seat.num}`;
          seatBtn.type = "button";
          seatBtn.className = `seat ${seat.type}`;
          seatBtn.innerText = seat.type === "occupied" ? "" : seat.num;
          seatBtn.dataset.id = seatId;

          if (seat.type !== "blank" && seat.type !== "occupied") {
            seatBtn.onclick = () => toggleSeat(seatBtn, seatId, seat.type, row.rowName, seat.num);
          }
          seatsDiv.appendChild(seatBtn);
        });
        rowElem.appendChild(seatsDiv);
        container.appendChild(rowElem);
      });
      listenToSeatUpdates();
    }

    function toggleSeat(btn, seatId, zoneType, rowName, num) {
      if (btn.classList.contains("occupied") || btn.classList.contains("holding")) return;

      if (btn.classList.contains("selected")) {
        btn.classList.remove("selected");
        selectedSeats = selectedSeats.filter(s => s.id !== seatId);
      } else {
        btn.classList.add("selected");
        let baseTable = selectedTier === 'bundle' ? bundlePrices : standardPrices;
        let finalPrice = baseTable[zoneType];
        
        if (appliedReferralCode !== "" && selectedSeats.length <= 2) {
          if (zoneType === 'zone-a') finalPrice = selectedTier === 'bundle' ? 55 : 25;
          if (zoneType === 'zone-b') finalPrice = selectedTier === 'bundle' ? 45 : 15;
        }

        selectedSeats.push({ id: seatId, price: finalPrice, zone: getZoneLabel(zoneType), zoneKey: zoneType, rowName: rowName, num: num });
      }

      recalculateSeatPrices();
      document.getElementById("selected-seats-text").innerText = selectedSeats.length ? selectedSeats.map(s => formatSeatLabel(s)).join(", ") : "None";
      document.getElementById("btn-to-page3").disabled = selectedSeats.length === 0;
    }

    async function lockSeatHolding() {
      if (!db) return;
      try {
        const batch = db.batch();
        selectedSeats.forEach(s => {
          const ref = db.collection("concert_seats").doc(s.id);
          batch.set(ref, { status: "holding", timestamp: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        });
        await batch.commit();
      } catch (err) {}
    }

    async function releaseSeatHolding() {
      if (!db) return;
      try {
        const batch = db.batch();
        selectedSeats.forEach(s => {
          const ref = db.collection("concert_seats").doc(s.id);
          batch.delete(ref);
        });
        await batch.commit();
      } catch (err) {}
    }

    function startHoldTimer() {
      if (holdTimerInterval) clearInterval(holdTimerInterval);
      let timeLeft = 600;

      holdTimerInterval = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById("hold-timer").innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        
        if (timeLeft <= 0) {
          clearInterval(holdTimerInterval);
          alert("Your 10-minute seat hold has expired. Returning to seat selection.");
          releaseSeatHolding();
          selectedSeats = [];
          goToPage(2);
        }
        timeLeft--;
      }, 1000);
    }

    function selectPaymentMethod(type) {
      document.querySelectorAll('.payment-card').forEach(c => c.classList.remove('active'));
      if (type === 'bank') {
        document.getElementById('pay-bank').checked = true;
        document.getElementById('pay-bank').closest('.payment-card').classList.add('active');
        selectedPaymentMethod = "Bank Transfer";
      } else {
        document.getElementById('pay-tng').checked = true;
        document.getElementById('pay-tng').closest('.payment-card').classList.add('active');
        selectedPaymentMethod = "Touch 'n Go eWallet";
      }
      validatePage3();
    }

    function validatePage3() {
      document.getElementById("btn-to-page4").disabled = !(document.getElementById("tc-checkbox").checked && selectedPaymentMethod !== "");
    }

    function handleFinalSubmit(e) {
      if (e) e.preventDefault();
      if (holdTimerInterval) clearInterval(holdTimerInterval);

      const ticketId = `#UIM-2026-${Date.now().toString().slice(-6)}-${Math.floor(1000 + Math.random() * 9000)}`;
      const name = document.getElementById("input-name").value;
      const studentId = document.getElementById("input-student-id").value;
      const email = document.getElementById("input-email").value;
      const phone = document.getElementById("input-phone").value;
      const seatsText = selectedSeats.map(s => formatSeatLabel(s)).join(", ");
      const totalPaid = selectedSeats.reduce((sum, s) => sum + s.price, 0);
      const referralUsed = appliedReferralCode || "None";
      const ticketTypeStr = selectedTier === 'bundle' ? "Bundle + T-Shirt" : "Standard Ticket";

      document.getElementById("ticket-name").innerText = name;
      document.getElementById("ticket-student-id").innerText = studentId || "N/A";
      document.getElementById("ticket-phone").innerText = phone || "-";
      document.getElementById("ticket-seats").innerText = seatsText;
      document.getElementById("ticket-price").innerText = totalPaid;
      document.getElementById("ticket-id").innerText = ticketId;
      document.getElementById("ticket-tier-label").innerText = ticketTypeStr;

      const qrContainer = document.getElementById("ticket-qr-container");
      qrContainer.innerHTML = "";
      if (typeof QRCode !== "undefined") {
        new QRCode(qrContainer, { text: ticketId, width: 130, height: 130, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
      }

      goToPage(5);

      if (db) {
        try {
          const batch = db.batch();
          selectedSeats.forEach(s => {
            batch.set(db.collection("concert_seats").doc(s.id), { status: "occupied", bookedBy: name, ticketId: ticketId });
          });
          batch.set(db.collection("tickets").doc(ticketId), {
            ticketId: ticketId,
            name: name,
            studentId: studentId || "N/A",
            phone: phone,
            seats: seatsText,
            ticketType: ticketTypeStr,
            totalPaid: totalPaid,
            scanned: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          batch.commit().catch(() => {});
        } catch (err) {}
      }

      const file = document.getElementById("receipt-file").files[0];
      const sendData = (fileData, fileName, fileType) => {
        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST", 
          mode: "no-cors", 
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ticketId, name, studentId, email, phone, ticketType: ticketTypeStr, seats: seatsText, totalPaid, paymentMethod: selectedPaymentMethod, referralUsed, fileData, fileName, fileType })
        }).catch(() => {});
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = e => sendData(e.target.result, file.name, file.type);
        reader.readAsDataURL(file);
      } else {
        sendData("", "", "");
      }
    }

    function goToPage(pageNum) {
      if (pageNum !== 3 && holdTimerInterval) {
        clearInterval(holdTimerInterval);
      }

      for (let i = 1; i <= 5; i++) {
        const p = document.getElementById(`page-${i}`);
        if (p) p.style.display = "none";
      }

      if (pageNum === 3) {
        lockSeatHolding();
        startHoldTimer();
        document.getElementById("payment-tier-summary").innerText = selectedTier === 'bundle' ? '⭐ T-Shirt Bundle (+T-shirt)' : 'Standard Ticket';
        document.getElementById("payment-seats-summary").innerText = selectedSeats.map(s => formatSeatLabel(s)).join(", ");
        recalculateSeatPrices();
      }

      document.getElementById(`page-${pageNum}`).style.display = "block";
      window.scrollTo(0, 0);
    }

    window.onload = () => {
      updatePricingUI();
      renderSeatingGrid();

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("visible"); });
      }, { threshold: 0.1 });
      document.querySelectorAll('.animate-on-scroll').forEach(section => observer.observe(section));
    };
  </script>
